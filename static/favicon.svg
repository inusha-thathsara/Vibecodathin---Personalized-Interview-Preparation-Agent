<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" />

  <!-- Outer Layer Stack (Cohort Symbol) -->
  <path d="M32 10 L52 20 L32 30 L12 20 Z" fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.9" />
  <path d="M12 28 L32 38 L52 28 L32 18 Z" fill="url(#purpleGrad)" opacity="0.75" />
  <path d="M12 36 L32 46 L52 36 L32 26 Z" fill="url(#cyanGrad)" opacity="0.6" />

  <!-- Neural Core Nodes -->
  <circle cx="32" cy="20" r="3.5" fill="#ffffff" filter="url(#glow)" />
  <circle cx="12" cy="28" r="2.5" fill="#38bdf8" />
  <circle cx="52" cy="28" r="2.5" fill="#818cf8" />
  <circle cx="32" cy="46" r="3" fill="#c084fc" />
</svg>
